# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
lang: ko-KR

# Change to your timezone › https://zones.arilyn.cc
timezone: Asia/Seoul

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: '주식 투자 알고리즘 매매 일지' # 메인 타이틀

tagline: '데이터와 알고리즘 기반 퀀트 투자 아카이빙' # 부제목

description: >- # 구글 검색 및 메타 태그 설명
  데이터 기반 주식 자동매매 및 백테스팅 알고리즘 운용 기록을 매주 아카이빙하는 퀀트 투자 블로그입니다.

# Fill in the protocol & hostname for your site. (끝에 '/' 제외)
url: "https://pow9851.github.io"

github:
  username: 본인의_깃허브_아이디 # GitHub 사용자명

twitter:
  username: # 비워둠 (사용 안 함)

social:
  name: 손투자 # 작성자 닉네임
  links:
    - https://github.com/pow9851

# Site Verification Settings (추후 구글 서치콘솔 등록 시 사용)
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings (추후 구글 애널리틱스 연동 시 ID 입력)
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Page views settings
pageviews:
  provider:

# Prefer color scheme setting. (비워두면 시스템 다크/라이트 모드 자동 감지)
theme_mode:

cdn:

# 사이드바 프로필 이미지 (추후 assets 폴더에 넣고 경로 지정 가능)
avatar:

social_preview_image:

# 포스트 내 목차(TOC) 표시 여부
toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

# 댓글 시스템 (추후 필요 시 giscus 등 연동)
comments:
  provider:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
